<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binger &amp; Clément</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400&family=Noto+Serif+SC:wght@300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: row;
    }

    /* ── PANELS ── */
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transition: flex .65s cubic-bezier(.76,0,.24,1);
    }
    .panel:hover { flex: 1.3; }

    .panel-laique  { background: #1C2B1F; border-right: 1px solid rgba(158,197,163,.08); }
    .panel-chinois { background: #D91F26; }

    /* ── HEADER (centered, fixed) ── */
    .site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.2rem 2rem 0;
      z-index: 10;
      pointer-events: none;
    }
    .site-title {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1.5rem, 2.8vw, 2.4rem);
      letter-spacing: .04em;
      line-height: 1.1;
      color: rgba(245,240,232,.55);
      white-space: nowrap;
    }
    .site-sub {
      margin-top: .45rem;
      font-size: .52rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(245,240,232,.22);
    }

    /* ── PANEL CONTENT ── */
    .panel-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8rem;
      padding: 2rem;
    }

    .panel-illus {
      width: min(40vw, 280px);
      height: min(32vh, 220px);
      object-fit: contain;
      transition: transform .65s cubic-bezier(.76,0,.24,1);
      display: block;
    }
    .panel-laique  .panel-illus { opacity: .9; }
    .panel-chinois .panel-illus { mix-blend-mode: screen; opacity: .95; }
    .panel:hover .panel-illus   { transform: scale(1.05); }

    .panel-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .45rem;
      text-align: center;
    }
    .panel-name {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1.15rem, 2.2vw, 1.75rem);
      letter-spacing: .04em;
      line-height: 1.1;
    }
    .panel-laique  .panel-name { color: #9EC5A3; }
    .panel-chinois .panel-name { font-family: 'Noto Serif SC', serif; font-style: normal; color: #E8D19A; }

    .panel-date {
      font-size: .53rem;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .panel-laique  .panel-date { color: rgba(158,197,163,.42); }
    .panel-chinois .panel-date { color: rgba(201,168,76,.42); }

    .panel-cta {
      font-size: .53rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity .3s ease, transform .3s ease;
    }
    .panel-laique  .panel-cta { color: #9EC5A3; }
    .panel-chinois .panel-cta { color: #C9A84C; }
    .panel:hover .panel-cta { opacity: 1; transform: translateY(0); }

    /* ── MOBILE ── */
    @media (max-width: 600px) {
      html, body { height: auto; overflow: auto; }
      body { flex-direction: column; }
      .panel { min-height: 50svh; flex: none !important; }
      .panel-laique { border-right: none; border-bottom: 1px solid rgba(158,197,163,.08); }
      .site-header { position: static; pointer-events: auto; padding: 2.5rem 1.5rem 0; background: #1C2B1F; }

      .panel-illus { width: min(55vw, 200px); }
      .panel-cta { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <p class="site-title">Binger &amp; Clément</p>
  <p class="site-sub">Our celebrations · Nos célébrations · 我们的婚礼</p>
</header>

<a class="panel panel-laique" href="laique.html">
  <div class="panel-content">
    <img src="images/illustration-laique.png" class="panel-illus" alt="Mariage Laïque">
    <div class="panel-label">
      <span class="panel-name">French Wedding</span>
      <span class="panel-date">15 May 2027 · Château de Roussillon</span>
    </div>
    <span class="panel-cta">Discover →</span>
  </div>
</a>

<a class="panel panel-chinois" href="chinois.html">
  <div class="panel-content">
    <img src="images/illustration-chinois.png" class="panel-illus" alt="中式婚礼">
    <div class="panel-label">
      <span class="panel-name">中式传统婚礼</span>
      <span class="panel-date">2027年7月25日</span>
    </div>
    <span class="panel-cta">探索 →</span>
  </div>
</a>

</body>
</html>
